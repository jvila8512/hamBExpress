# Sized for a 12 GB machine: the previous 8G/4G/4G caps exceeded physical RAM
# and left the Kotlin compile daemon unable to spawn (4 connect retries).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1G

# Evitar timeouts
org.gradle.timeout=60m
android.defaults.buildfeatures.buildconfig=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
